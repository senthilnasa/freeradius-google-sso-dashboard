# Captive Portal Configuration - radius.krea.edu.in

# HTTP server - Redirect to HTTPS and serve ACME challenges
server {
    listen 80;
    listen [::]:80;
    server_name radius.krea.edu.in;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server - Main captive portal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name radius.krea.edu.in;

    # SSL certificate paths (Local SSL certificates from ./ssl directory)
    ssl_certificate /etc/nginx/ssl/radius.krea.edu.in.crt;
    ssl_certificate_key /etc/nginx/ssl/radius.krea.edu.in.key;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP stapling (disabled for local SSL certificates)
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/nginx/ssl/radius.krea.edu.in.chain.pem;
    # resolver 8.8.8.8 8.8.4.4 valid=300s;
    # resolver_timeout 5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https://accounts.google.com https://www.googleapis.com; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com https://www.googleapis.com;" always;

    # Logging
    access_log /var/log/nginx/portal-access.log main;
    error_log /var/log/nginx/portal-error.log warn;

    # Root and index
    root /var/www/html;
    index index.html;

    # Client settings
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_redirect off;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Rate limiting for login endpoint
    location /login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_conn addr 10;

        proxy_pass http://captive-portal:8080;
    }

    # Rate limiting for OAuth callback
    location /callback {
        limit_req zone=login_limit burst=5 nodelay;

        proxy_pass http://captive-portal:8080;
    }

    # API endpoints with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        limit_conn addr 20;

        proxy_pass http://captive-portal:8080;
    }

    # Health check endpoint (no rate limiting)
    location /health {
        access_log off;
        proxy_pass http://captive-portal:8080;
    }

    # Static files
    location /static/ {
        alias /var/www/html/static/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Main application
    location / {
        limit_req zone=general_limit burst=20 nodelay;
        limit_conn addr 10;

        proxy_pass http://captive-portal:8080;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to backup and config files
    location ~ \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
