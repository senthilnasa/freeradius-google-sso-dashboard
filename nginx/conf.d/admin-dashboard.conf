# Admin Dashboard Configuration - admin-radius.krea.edu.in

# HTTP server - Redirect to HTTPS and serve ACME challenges
server {
    listen 80;
    listen [::]:80;
    server_name admin-radius.krea.edu.in;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server - Admin Dashboard
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin-radius.krea.edu.in;

    # SSL certificate paths (Local SSL certificates from ./ssl directory)
    ssl_certificate /etc/nginx/ssl/admin-radius.krea.edu.in.crt;
    ssl_certificate_key /etc/nginx/ssl/admin-radius.krea.edu.in.key;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP stapling (disabled for local SSL certificates)
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/nginx/ssl/admin-radius.krea.edu.in.chain.pem;
    # resolver 8.8.8.8 8.8.4.4 valid=300s;
    # resolver_timeout 5s;

    # Security headers (stricter for admin dashboard)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Logging
    access_log /var/log/nginx/admin-access.log main;
    error_log /var/log/nginx/admin-error.log warn;

    # Client settings
    client_max_body_size 20M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_redirect off;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Admin login - strict rate limiting
    location /login {
        limit_req zone=login_limit burst=2 nodelay;
        limit_conn addr 5;

        proxy_pass http://admin-dashboard:80;
    }

    location /admin/login {
        limit_req zone=login_limit burst=2 nodelay;
        limit_conn addr 5;

        proxy_pass http://admin-dashboard:80;
    }

    # API endpoints
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn addr 20;

        proxy_pass http://admin-dashboard:80;
    }

    # Export endpoints (CSV/Excel) - higher limits
    location /admin/export/ {
        limit_req zone=api_limit burst=5 nodelay;
        limit_conn addr 5;

        proxy_read_timeout 600s;
        proxy_pass http://admin-dashboard:80;
    }

    # Health check endpoint (no rate limiting, no auth required)
    location /health.php {
        access_log off;
        proxy_pass http://admin-dashboard:80;
    }

    # Static assets
    location /assets/ {
        expires 1d;
        add_header Cache-Control "public, immutable";
        access_log off;

        proxy_pass http://admin-dashboard:80;
    }

    location /css/ {
        expires 1d;
        add_header Cache-Control "public, immutable";
        access_log off;

        proxy_pass http://admin-dashboard:80;
    }

    location /js/ {
        expires 1d;
        add_header Cache-Control "public, immutable";
        access_log off;

        proxy_pass http://admin-dashboard:80;
    }

    location /images/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;

        proxy_pass http://admin-dashboard:80;
    }

    # Main application routing
    location / {
        limit_req zone=general_limit burst=20 nodelay;
        limit_conn addr 10;

        proxy_pass http://admin-dashboard:80;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~ \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist|md|env)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to composer files
    location ~ /composer\.(json|lock)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to Git files
    location ~ /\.git {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to vendor directory
    location ~ ^/vendor {
        deny all;
        access_log off;
        log_not_found off;
    }
}
