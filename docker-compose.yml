version: '3.8'

services:
  # =====================================================
  # MySQL Database
  # =====================================================
  mysql:
    image: mysql:8.0
    container_name: radius-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-radius}
      MYSQL_USER: ${MYSQL_USER:-radius}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-radiuspassword}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    ports:
      - "3306:3306"
    networks:
      - radius-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password

  # =====================================================
  # FreeRADIUS Server
  # =====================================================
  freeradius:
    build:
      context: ./freeradius
      dockerfile: Dockerfile
    container_name: radius-server
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-radius}
      MYSQL_USER: ${MYSQL_USER:-radius}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-radiuspassword}
      RADIUS_SECRET: ${RADIUS_SECRET:-testing123}
    volumes:
      - ./freeradius/certs:/etc/freeradius/3.0/certs
      - ./logs/freeradius:/var/log/freeradius
    ports:
      - "1812:1812/udp"  # RADIUS Authentication
      - "1813:1813/udp"  # RADIUS Accounting
    networks:
      - radius-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "radtest", "test", "test", "localhost", "0", "testing123"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =====================================================
  # Captive Portal (Golang)
  # =====================================================
  captive-portal:
    build:
      context: ./captive-portal
      dockerfile: Dockerfile
    container_name: radius-captive-portal
    restart: unless-stopped
    environment:
      # Database
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-radius}
      DB_USER: ${MYSQL_USER:-radius}
      DB_PASSWORD: ${MYSQL_PASSWORD:-radiuspassword}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://portal.yourdomain.com/callback}
      GOOGLE_HOSTED_DOMAIN: ${GOOGLE_HOSTED_DOMAIN:-krea.edu.in}

      # RADIUS
      RADIUS_SERVER: freeradius
      RADIUS_SECRET: ${RADIUS_SECRET:-testing123}
      RADIUS_AUTH_PORT: 1812
      RADIUS_ACCT_PORT: 1813

      # Security
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-change-this}
      SESSION_SECRET: ${SESSION_SECRET:-your-session-secret-change-this}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-28800}  # 8 hours in seconds
      CSRF_SECRET: ${CSRF_SECRET:-your-csrf-secret-change-this}

      # Application
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: "8080"
      APP_URL: ${APP_URL:-https://portal.yourdomain.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Branding
      BRANDING_LOGO_URL: ${BRANDING_LOGO_URL:-https://via.placeholder.com/200x60?text=Institution+Logo}
      BRANDING_INSTITUTION_NAME: ${BRANDING_INSTITUTION_NAME:-Network Authentication}
      BRANDING_PRIMARY_COLOR: ${BRANDING_PRIMARY_COLOR:-#667eea}
    volumes:
      - ./logs/captive-portal:/app/logs
    ports:
      - "8080:8080"
    networks:
      - radius-network
    depends_on:
      mysql:
        condition: service_healthy
      freeradius:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =====================================================
  # Admin Dashboard (PHP)
  # =====================================================
  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: radius-admin-dashboard
    restart: unless-stopped
    environment:
      # Database
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-radius}
      DB_USER: ${MYSQL_USER:-radius}
      DB_PASSWORD: ${MYSQL_PASSWORD:-radiuspassword}

      # Application
      APP_ENV: ${APP_ENV:-production}
      APP_URL: ${ADMIN_URL:-https://admin.yourdomain.com}
      APP_NAME: "RADIUS Admin Dashboard"

      # Security
      SESSION_SECRET: ${SESSION_SECRET:-your-session-secret-change-this}
      SESSION_LIFETIME: 3600  # 1 hour

      # PHP Configuration
      PHP_MEMORY_LIMIT: 256M
      PHP_MAX_EXECUTION_TIME: 300
      PHP_UPLOAD_MAX_FILESIZE: 10M
    volumes:
      - ./logs/admin-dashboard:/var/www/html/logs
    ports:
      - "9000:80"
    networks:
      - radius-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health.php"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =====================================================
  # Nginx Reverse Proxy
  # =====================================================
  nginx:
    image: nginx:alpine
    container_name: radius-nginx
    restart: unless-stopped
    environment:
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-admin@yourdomain.com}
      - PORTAL_DOMAIN=${PORTAL_DOMAIN:-radius.krea.edu.in}
      - ADMIN_DOMAIN=${ADMIN_DOMAIN:-admin-radius.krea.edu.in}
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - nginx-webroot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - radius-network
    depends_on:
      - captive-portal
      - admin-dashboard
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://captive-portal:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =====================================================
  # Certbot for Let's Encrypt SSL Certificates
  # =====================================================
  certbot:
    image: certbot/certbot:latest
    container_name: radius-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - nginx-webroot:/var/www/certbot
      - ./certbot/logs:/var/log/letsencrypt
    depends_on:
      - nginx
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${CERTBOT_EMAIL:-admin@yourdomain.com} --agree-tos --no-eff-email --force-renewal -d ${PORTAL_DOMAIN:-portal.yourdomain.com} -d ${ADMIN_DOMAIN:-admin.yourdomain.com}
    networks:
      - radius-network

  # =====================================================
  # Certbot Renewal Service (runs daily)
  # =====================================================
  certbot-renew:
    image: certbot/certbot:latest
    container_name: radius-certbot-renew
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - nginx-webroot:/var/www/certbot
      - ./certbot/logs:/var/log/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot; sleep 12h & wait $${!}; done;'"
    networks:
      - radius-network
    depends_on:
      - nginx

  # =====================================================
  # Redis (Optional - for session caching)
  # =====================================================
  redis:
    image: redis:7-alpine
    container_name: radius-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - radius-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# =====================================================
# Networks
# =====================================================
networks:
  radius-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# =====================================================
# Volumes
# =====================================================
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  certbot-etc:
    driver: local
  certbot-var:
    driver: local
  nginx-webroot:
    driver: local
