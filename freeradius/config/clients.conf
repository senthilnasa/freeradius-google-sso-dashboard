# -*- text -*-
##
## FreeRADIUS Clients Configuration
## Defines which network devices (NAS) can connect to RADIUS server
##

# Localhost client for testing
client localhost {
    ipaddr = 127.0.0.1
    proto = *
    secret = krea_radius_shared_secret_2024
    require_message_authenticator = no
    nas_type = other
    limit {
        max_connections = 16
        lifetime = 0
        idle_timeout = 30
    }
}

# IPv6 localhost
client localhost_ipv6 {
    ipv6addr = ::1
    secret = krea_radius_shared_secret_2024
}

# Allow entire internal network (for development/testing)
# In production, specify individual NAS devices
client internal_network {
    ipaddr = 172.20.0.0/16
    secret = krea_radius_shared_secret_2024
    require_message_authenticator = no
    nas_type = other
}

# Docker network
client docker_network {
    ipaddr = 172.17.0.0/16
    secret = krea_radius_shared_secret_2024
    require_message_authenticator = no
    nas_type = other
}

